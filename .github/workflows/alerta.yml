# Roda o bot a cada 3 horas e salva o estado (ofertas já avisadas) no repositório.
name: Alerta de promoções

on:
  schedule:
    # Minuto 17 a cada 3 horas (horário UTC). Evitamos o minuto 0 porque
    # é quando o GitHub fica mais congestionado e as execuções atrasam.
    - cron: "17 */3 * * *"
  workflow_dispatch:   # permite rodar manualmente pelo botão "Run workflow"

permissions:
  contents: write      # necessário para gravar o estado.json de volta no repositório

concurrency:
  group: alerta-promocoes   # nunca roda duas vezes ao mesmo tempo
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar o código
        uses: actions/checkout@v6

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Verificar promoções e avisar no Telegram
        env:
          ITAD_API_KEY: ${{ secrets.ITAD_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          # Opcionais: crie em Settings > Secrets and variables > Actions > aba "Variables"
          DESCONTO_MINIMO: ${{ vars.DESCONTO_MINIMO }}
          INCLUIR_DLC: ${{ vars.INCLUIR_DLC }}
        run: python bot.py

      - name: Salvar ofertas já avisadas
        if: always()   # salva mesmo se uma das fontes falhou, para não repetir avisos
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add estado.json || exit 0
          if git diff --cached --quiet; then
            echo "Nada novo para salvar."
          else
            git commit -m "Atualiza ofertas avisadas"
            git push
          fi
